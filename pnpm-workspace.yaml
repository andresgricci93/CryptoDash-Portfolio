auditConfig:
  # extract-zip (via html-pdf-node>puppeteer): install-time only (unzips
  # Chromium from Google over HTTPS); never runs at runtime, no user input,
  # no patched release exists.
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3

overrides:
  sharp: 0.35.5
  node-fetch: '>=2.6.7'
  ws: '>=8.21.0 <9'
  tar-fs: '>=2.1.4'
  nth-check: '>=2.0.1'
  handlebars: '>=4.7.10 <5'
  "html-pdf-node>inline-css": '^4.0.3'
  proxy-addr: '>=2.0.8'
  basic-ftp: '>=6.2.1 <7'
  protobufjs: '>=7.6.6 <8'
  qs: '>=6.16.0 <7'
  body-parser: '>=2.3.0 <3'
  fflate: '>=0.8.3 <0.9'
  zod: '>=4.6.6 <5'
  brace-expansion: '>=1.1.20 <2'
  minimatch: '>=3.1.4 <4'
  js-yaml: '>=4.3.2 <5'
  jws: '>=3.2.3 <4'
  path-to-regexp: '>=8.4.0 <9'
  form-data: '>=4.0.6 <5'
  ip-address: '>=10.3.1 <11'
  "docx>nanoid": '>=5.1.16 <6'

# pnpm 10
onlyBuiltDependencies:
  - core-js
  - esbuild
  - protobufjs
  - puppeteer
  - sharp

# pnpm 11+ (Render installs latest via npm i -g pnpm)
allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true
  puppeteer: true
  sharp: true
